<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Magnolia Creations</title>

  <style>
    body {
      margin: 0;
      background-color: #f4f4f4;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER */
    .site-header {
      width: 100%;
      padding: 70px 24px 50px 24px;
      background-color: #ffffff;
      text-align: center;
      border-bottom: 1px solid #e5e5e5;
      font-family: 'Times New Roman', Georgia, serif;
    }

    .site-header h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 400;
      letter-spacing: 0.5px;
      color: #1f1f1f;
    }

    .site-header p {
      margin-top: 18px;
      font-size: 13px;
      letter-spacing: 3px;
      color: #7a7a7a;
      text-transform: uppercase;
    }

    /* CARD */
    .magnolia-card {
      max-width: 760px;
      margin: 70px auto;
      background-color: #fbfbfa;
      border: 1px solid #e3e3e3;
      font-family: 'Times New Roman', Georgia, serif;
      text-align: center;
      overflow: hidden;
      transition: box-shadow 0.4s ease, transform 0.4s ease;
    }

    .magnolia-card:hover {
      box-shadow: 0 18px 40px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }

    .magnolia-preview,
    .magnolia-full {
      padding: 48px 36px;
    }

    .magnolia-preview {
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .magnolia-full {
      max-height: 0;
      opacity: 0;
      transform: translateY(12px);
      overflow: hidden;
      padding-top: 0;
      padding-bottom: 0;
      transition:
        max-height 0.8s cubic-bezier(0.4, 0.0, 0.2, 1),
        opacity 0.5s ease,
        transform 0.5s ease;
    }

    .magnolia-card:hover .magnolia-preview {
      opacity: 0;
      transform: translateY(-6px);
    }

    .magnolia-card:hover .magnolia-full {
      max-height: 1400px;
      opacity: 1;
      transform: translateY(0);
      padding: 48px 36px;
    }

    .magnolia-image {
      width: 100%;
      display: block;
      border-top: 1px solid #e3e3e3;
      border-bottom: 1px solid #e3e3e3;
      transition: transform 0.6s ease;
    }

    .magnolia-card:hover .magnolia-image {
      transform: scale(1.015);
    }

    /* CONTACT */
    .contact-footer {
      max-width: 760px;
      margin: 60px auto 90px auto;
      text-align: center;
      font-family: 'Times New Roman', Georgia, serif;
    }

    .contact-footer p {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6f6f6f;
      margin-bottom: 12px;
    }

    .contact-footer a {
      font-size: 15px;
      color: #1f1f1f;
      text-decoration: none;
      border-bottom: 1px solid #cfcfcf;
      padding-bottom: 2px;
    }
  </style>
</head>

<body>

  <div class="site-header">
    <h1>Magnolia Creations</h1>
    <p>Architectural Preset Builds</p>
  </div>

  <!-- WHERE HOUSE CARDS GO -->
  <div id="listings"></div>

  <div class="contact-footer">
    <p>To purchase or request a build</p>
    <a href="https://www.tiktok.com/@domafosoddn?_r=1&_t=ZP-93Q8xEWn4VK" target="_blank">
      Contact us on TikTok
    </a>
  </div>

  <script src="houses.js"></script>
  <script src="render.js"></script>

</body>
</html>
