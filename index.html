<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas – Visual Wishlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Quick Add Modal -->
    <div id="quickAddModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content modal-quickadd">
            <button class="modal-close" id="quickAddClose">×</button>
            <h2>Add Item</h2>
            
            <div class="quickadd-tabs">
                <button class="tab-btn active" data-tab="easy">Quick</button>
                <button class="tab-btn" data-tab="full">Full</button>
            </div>

            <!-- Easy Tab -->
            <div id="easy-tab" class="tab-content active">
                <div class="form-group">
                    <label for="easyName">What is it?</label>
                    <input type="text" id="easyName" class="form-input" placeholder="e.g., Blue ceramic mug" />
                </div>
                <div class="form-group">
                    <label for="easyImage">Image (optional)</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="easyImage" class="file-input" accept="image/*" />
                        <span class="file-label">Choose image</span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="easyLink">Link (optional)</label>
                    <input type="url" id="easyLink" class="form-input" placeholder="https://..." />
                </div>
            </div>

            <!-- Full Tab -->
            <div id="full-tab" class="tab-content">
                <div class="form-group">
                    <label for="fullName">Name *</label>
                    <input type="text" id="fullName" class="form-input" placeholder="Item name" />
                </div>
                <div class="form-group">
                    <label for="fullImage">Image (optional)</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="fullImage" class="file-input" accept="image/*" />
                        <span class="file-label">Choose image</span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="fullLink">Link (optional)</label>
                    <input type="url" id="fullLink" class="form-input" placeholder="https://..." />
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" id="quickAddCancel">Cancel</button>
                <button class="btn btn-primary" id="quickAddConfirm">Add</button>
            </div>
        </div>
    </div>

    <!-- Item Detail Modal -->
    <div id="itemModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content modal-item">
            <button class="modal-close" id="itemClose">×</button>
            <div id="itemContent" class="item-modal-content">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1 class="logo">Canvas</h1>
            </div>
            <div class="header-right">
                <div class="search-wrapper">
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="search-input" 
                        placeholder="Search items..."
                    />
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </div>
                <button class="btn btn-icon" id="addBtn" title="Add item">+</button>
                <button class="btn btn-icon" id="menuBtn" title="Menu">⋯</button>
            </div>
        </header>

        <!-- Items Section -->
        <section class="items-section">
            <div class="section-header">
                <h2>Your Items</h2>
                <span class="item-count" id="itemCount">0</span>
            </div>
            <div class="items-grid" id="itemsGrid">
                <!-- Items populated by JS -->
            </div>
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">✨</div>
                <h3>No items yet</h3>
                <p>Click the + button to add your first item</p>
            </div>
        </section>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button class="quick-action-btn" id="pasteBtn" title="Paste from clipboard">📋 Paste</button>
            <button class="quick-action-btn" id="importBtn" title="Import items">↑ Import</button>
            <button class="quick-action-btn" id="exportBtn" title="Export items">↓ Export</button>
        </div>
    </div>

    <!-- Hidden Inputs -->
    <input type="file" id="jsonInput" class="hidden-input" accept=".json" />

    <script src="script.js"></script>
</body>
</html>
