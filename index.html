<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giftful – Visual Wishlist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>Giftful</h1>
                <p class="subtitle">A visual wishlist. Local. Yours.</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" id="downloadBtn" title="Export wishlist as JSON">↓ Export</button>
                <button class="btn btn-secondary" id="uploadBtn" title="Import wishlist from JSON">↑ Import</button>
                <button class="btn btn-danger" id="clearAllBtn" title="Remove all items">✕ Clear All</button>
            </div>
        </header>

        <section class="input-section">
            <div class="input-wrapper">
                <input 
                    type="url" 
                    id="urlInput" 
                    class="url-input"
                    placeholder="Paste a link (https://...)"
                    autocomplete="off"
                />
                <button class="btn btn-primary" id="addBtn">Add to Wishlist</button>
            </div>

            <div class="upload-zone" id="uploadZone">
                <div class="upload-content">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="upload-icon">
                        <path d="M20 4v20m-10-5l10 10 10-10M8 32h24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <p class="upload-text">Drag image here or <span class="upload-link">click to upload</span></p>
                    <p class="upload-hint">PNG, JPG, GIF (max 5MB)</p>
                </div>
                <input type="file" id="imageInput" class="file-input" accept="image/*" />
            </div>
        </section>

        <section class="wishlist-section">
            <div class="wishlist-header">
                <h2>Your Wishlist</h2>
                <span class="item-count" id="itemCount">0 items</span>
            </div>
            <div class="wishlist-grid" id="wishlistGrid">
                <!-- Items populated by JavaScript -->
            </div>
            <div class="empty-state" id="emptyState">
                <div class="empty-content">
                    <p class="empty-text">Your wishlist is empty</p>
                    <p class="empty-hint">Add your first item by pasting a link and uploading an image</p>
                </div>
            </div>
        </section>
    </div>

    <div class="modal-overlay" id="modalOverlay"></div>
    <input type="file" id="jsonInput" class="hidden-file-input" accept=".json" />

    <script src="script.js"></script>
</body>
</html>
