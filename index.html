<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Magnolia Creations</title>

  <style>
    body {
      margin: 0;
      background-color: #f4f4f4;
      font-family: 'Times New Roman', Georgia, serif;
    }

    /* HEADER */
    .site-header {
      width: 100%;
      padding: 70px 24px 50px;
      background-color: #ffffff;
      text-align: center;
      border-bottom: 1px solid #e5e5e5;
    }

    .site-header h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 400;
      letter-spacing: 0.5px;
      color: #1f1f1f;
    }

    .site-header p {
      margin-top: 18px;
      font-size: 13px;
      letter-spacing: 3px;
      color: #7a7a7a;
      text-transform: uppercase;
    }

    /* LISTINGS WRAPPER */
    #listings {
      padding: 70px 20px;
    }

    /* CARD */
    .magnolia-card {
      max-width: 760px;
      margin: 0 auto 80px;
      background-color: #fbfbfa;
      border: 1px solid #e3e3e3;
      text-align: center;
      overflow: hidden;
    }

    .magnolia-preview,
    .magnolia-full {
      padding: 48px 36px;
    }

    .magnolia-preview {
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .magnolia-full {
      max-height: 0;
      opacity: 0;
      transform: translateY(12px);
      overflow: hidden;
      transition:
        max-height 0.7s ease,
        opacity 0.45s ease,
        transform 0.45s ease;
      padding-top: 0;
      padding-bottom: 0;
    }

    .magnolia-card:hover .magnolia-preview {
      opacity: 0;
      transform: translateY(-6px);
    }

    .magnolia-card:hover .magnolia-full {
      max-height: 1600px;
      opacity: 1;
      transform: translateY(0);
      padding: 48px 36px;
    }

    /* IMAGES */
    .magnolia-image-wrapper {
      position: relative;
      border-top: 1px solid #e3e3e3;
    }

    .magnolia-image {
      width: 100%;
      display: block;
    }

    .image-label {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background-color: rgba(255, 255, 255, 0.9);
      padding: 6px 10px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #1f1f1f;
    }

    /* FOOTER */
    .site-footer {
      background-color: #ffffff;
      border-top: 1px solid #e5e5e5;
      padding: 60px 24px;
      text-align: center;
    }

    .site-footer p {
      font-size: 13px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #7a7a7a;
      margin-bottom: 14px;
    }

    .site-footer a {
      font-size: 15px;
      color: #1f1f1f;
      text-decoration: none;
      border-bottom: 1px solid #1f1f1f;
      padding-bottom: 2px;
    }

    .site-footer a:hover {
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="site-header">
    <h1>Magnolia Creations</h1>
    <p>Architectural Preset Builds</p>
  </div>

  <!-- LISTINGS -->
  <div id="listings"></div>

  <!-- FOOTER -->
  <div class="site-footer">
    <p>Commission & Build Inquiries</p>
    <a
      href="https://www.tiktok.com/@domafosoddn?_r=1&_t=ZP-93Q8xEWn4VK"
      target="_blank"
    >
      Contact via TikTok
    </a>
  </div>

  <!-- SCRIPTS -->
  <script src="houses.js"></script>
  <script src="render.js"></script>

</body>
</html>
