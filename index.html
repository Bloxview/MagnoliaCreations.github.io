<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Event Link App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 500px;
        margin: auto;
    }

    h1 {
        text-align: center;
    }

    input, textarea, button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
    }

    input, textarea {
        background: #1e293b;
        color: white;
    }

    button {
        background: #3b82f6;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #2563eb;
    }

    .card {
        background: #1e293b;
        padding: 20px;
        border-radius: 12px;
        margin-top: 20px;
    }

    .link-box {
        margin-top: 15px;
        word-break: break-all;
        font-size: 14px;
        color: #93c5fd;
    }

    .small-btn {
        margin-top: 10px;
        background: #22c55e;
    }

    .qr {
        margin-top: 20px;
        text-align: center;
    }

    canvas {
        background: white;
        padding: 10px;
        border-radius: 10px;
    }
</style>
</head>

<body>

<div class="container">

<h1>Event Creator</h1>

<div id="creator">
    <input id="title" placeholder="Event Title">
    <input id="date" type="date">
    <input id="location" placeholder="Location">
    <textarea id="desc" placeholder="Description"></textarea>
    
    <button onclick="createEvent()">Generate Link</button>

    <div id="generatedLink" class="link-box"></div>
    <button class="small-btn" onclick="copyLink()">Copy Link</button>

    <div class="qr">
        <canvas id="qrCanvas"></canvas>
    </div>
</div>

<div id="viewer" style="display:none;">
    <h1>Event</h1>
    <div class="card" id="eventDisplay"></div>
</div>

</div>

<!-- QR Code Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js"></script>

<script>
let currentLink = "";

function createEvent() {
    const event = {
        title: document.getElementById("title").value,
        date: document.getElementById("date").value,
        location: document.getElementById("location").value,
        desc: document.getElementById("desc").value
    };

    const encoded = btoa(JSON.stringify(event));
    currentLink = window.location.origin + window.location.pathname + "?event=" + encoded;

    document.getElementById("generatedLink").innerText = currentLink;

    generateQR(currentLink);
}

function copyLink() {
    if (!currentLink) return;
    navigator.clipboard.writeText(currentLink);
    alert("Link copied!");
}

function generateQR(link) {
    const canvas = document.getElementById("qrCanvas");
    canvas.innerHTML = "";

    QRCode.toCanvas(canvas, link, function (error) {
        if (error) console.error(error);
    });
}

function loadEvent() {
    const params = new URLSearchParams(window.location.search);
    const data = params.get("event");

    if (!data) return;

    try {
        const event = JSON.parse(atob(data));

        document.getElementById("creator").style.display = "none";
        document.getElementById("viewer").style.display = "block";

        document.getElementById("eventDisplay").innerHTML = `
            <h2>${event.title}</h2>
            <p><strong>Date:</strong> ${event.date}</p>
            <p><strong>Location:</strong> ${event.location}</p>
            <p>${event.desc}</p>
        `;
    } catch (e) {
        console.error("Invalid event data");
    }
}

loadEvent();
</script>

</body>
</html>
